name = "ai17hub-website"
compatibility_date = "2026-02-25"
pages_build_output_dir = "./dist"

# Jurnalul lead-urilor (functions/api/lead.js). Optional: fara binding, formularul merge doar prin email
# (fara jurnal si fara rate limit; functia loghează un avertisment).
# Activare (nu am database_id; un id inventat ar rupe build-ul Pages):
#   1. wrangler d1 create ai17hub-leads --jurisdiction eu
#   2. descomenteaza blocul de mai jos si pune database_id-ul primit
#   3. wrangler d1 migrations apply ai17hub-leads --remote
#
# [[d1_databases]]
# binding = "LEADS_DB"
# database_name = "ai17hub-leads"
# database_id = "<database_id din pasul 1>"
# migrations_dir = "migrations"

# Secrete (Cloudflare Pages -> Settings -> Variables and Secrets): TURNSTILE_SECRET_KEY, RESEND_API_KEY.
# Variabile: LEAD_NOTIFY_TO (implicit office@ai17hub.ro), LEAD_FROM (implicit AI17 HUB <noreply@ai17hub.ro>).
# Local: .dev.vars (nu se comite).
